<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÉCHO a déménagé</title>
<meta name="description" content="ÉCHO, le jeu de labyrinthe dans le noir, a une nouvelle adresse : echo-jeu.github.io.">
<link rel="canonical" href="https://echo-jeu.github.io/">
<meta http-equiv="refresh" content="0; url=https://echo-jeu.github.io/">
<script>
// Même page, même requête, même fragment sur la nouvelle adresse (/Echo/x → /x).
(function () { var p = location.pathname.replace(/^\/Echo(?=\/|$)/i, '') || '/';
  location.replace('https://echo-jeu.github.io' + p + location.search + location.hash); })();
</script>
<link rel="icon" type="image/png" href="/Echo/icons/icon-192.png">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #05070a; color: #e9f4f6; }
  body { display: grid; place-items: center; text-align: center; font: 300 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { padding: 24px 16px; max-width: 420px; }
  h1 { font-weight: 200; font-size: 40px; letter-spacing: .4em; padding-left: .4em; margin: 0 0 12px; }
  a { color: #5cf2ff; }
  a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .en { color: #8fa3a8; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>ÉCHO</h1>
  <p>ÉCHO a déménagé : <a href="https://echo-jeu.github.io/">echo-jeu.github.io</a></p>
  <p class="en" lang="en">ÉCHO has moved: <a href="https://echo-jeu.github.io/">echo-jeu.github.io</a></p>
</main>
</body>
</html>
