  let cols, rows, fragileCount; const types = [];
  if (dailyMode) {
    cols = 12; rows = 18; types.push(RODEUSE, RODEUSE, PATROUILLE, AVEUGLE); fragileCount = 5; decoysMax = 2; beaconsMax = 2;
  } else {
    cols = min(5 + level, 16); rows = min(8 + Math.floor(level * 3 / 2), 26);
    if (boss) { types.push(MERE); for (let i = 0; i < Math.floor(level / 10); i++) types.push(RODEUSE); }
    else {
      for (let i = 0; i < min(1 + Math.floor((level - 1) / 2), 4); i++) types.push(RODEUSE);
      if (level >= 3) types.push(PATROUILLE);
      if (level >= 8) types.push(PATROUILLE);
      if (level >= 5) types.push(AVEUGLE);
      if (level >= 10) types.push(AVEUGLE);
    }
    if (level >= 7) types.push(REFLET);
    fragileCount = level >= 3 ? min(2 + Math.floor(level / 2), 8) : 0;
    decoysMax = level >= 2 ? 2 : 0;
    beaconsMax = level >= 4 ? 2 : 0;
  }

  floors = [];
  const f0 = buildFloor(gen, cols, rows, fragileCount);
  floors.push(f0);
  const m0 = f0.maze, dist0 = m0.bfs(0);
  let far0 = 1; for (let i = 0; i < dist0.length; i++) far0 = max(far0, dist0[i]);
  let spots0, spots1 = [], f1 = null;
  if (twoFloors) {
    const stairs = farCell(m0, 0, dist0);
    f0.stairsTo = 1; f0.stairsX = ccx(m0, stairs); f0.stairsY = ccy(m0, stairs);
    f1 = buildFloor(gen, cols, rows, fragileCount);
    floors.push(f1);
    f1.stairsTo = 0; f1.stairsX = f0.stairsX; f1.stairsY = f0.stairsY;
    const dist1 = f1.maze.bfs(stairs);
    const exitCell = farCell(f1.maze, stairs, dist1);
    f1.hasExit = true; f1.exitX = ccx(f1.maze, exitCell); f1.exitY = ccy(f1.maze, exitCell);
    par3 = max(2, Math.floor((dist0[stairs] + dist1[exitCell]) / 5));
    spots0 = shuffle([...dist0.keys()].filter(i => dist0[i] >= max(6, Math.floor(far0 / 3)) && i !== stairs), gen);
    spots1 = shuffle([...dist1.keys()].filter(i => dist1[i] >= 5 && i !== exitCell), gen);
  } else {
    const exitCell = farCell(m0, 0, dist0);
    f0.hasExit = true; f0.exitX = ccx(m0, exitCell); f0.exitY = ccy(m0, exitCell);
    par3 = max(2, Math.floor(dist0[exitCell] / 5));
    spots0 = shuffle([...dist0.keys()].filter(i => dist0[i] >= max(6, Math.floor(far0 / 3)) && i !== exitCell), gen);
  }
  par2 = par3 * 2;

  reflet = null;
  let s0 = 0, s1 = 0, alt = 0;
  for (const type of types) {
    if (type === REFLET) { reflet = newHunter(REFLET, 0.5, 0.5, 0); f0.hunters.push(reflet); continue; }
    const lower = f1 && (type !== RODEUSE || alt++ % 2 === 1);
    if (lower && s1 < spots1.length) addHunter(f1, type, spots1[s1++], gen);
    else if (s0 < spots0.length) addHunter(f0, type, spots0[s0++], gen);
  }

  floors.forEach((f, fi) => {
    const m = f.maze;
    const from = fi === 0 ? 0 : cellOf(m, f.stairsX, f.stairsY);
    const d = m.bfs(from);
    const used = new Set(f.hunters.map(h => h.atCell));
    if (f.hasExit) used.add(cellOf(m, f.exitX, f.exitY));
    if (f.stairsTo >= 0) used.add(cellOf(m, f.stairsX, f.stairsY));
    const sp = shuffle([...d.keys()].filter(i => d[i] >= 3 && !used.has(i)), gen);
    const count = floors.length === 1 ? 3 : fi === 0 ? 2 : 1;
    for (let k = 0; k < min(count, sp.length); k++) f.shards.push({ x: ccx(m, sp[k]), y: ccy(m, sp[k]), lit: -100, lastPulse: -1, taken: false });
  });
  shardsTotal = floors.reduce((a, f) => a + f.shards.length, 0);
  setFloor(0);

  px = 0.5; py = 0.5; vx = 0; vy = 0; facing = 0; camX = px; camY = py;
  pulses = []; decoys = []; particles = []; scheduled = [];
  energy = C.MAX_ENERGY; decoysLeft = decoysMax; beaconsLeft = beaconsMax; echoesUsed = 0; answerAt = -1; hintT = -100; beatTimer = 0;
  shardsTaken = 0; trailCount = 0; trailAcc = 0; trailOn = false; newRecord = false; stairsArmed = true;
  scanTimer = 0.5; goalTimer = 1.5; shardTimer = 1; floorBannerT = -100;
  tilt.recenter();
  state = PLAY; stateT = t; levelStartT = t;
  pushGameHistory();
  keepAwake();

  let intro = dailyMode ? L('sDaily') : L('sLevel', level) + (boss ? ' ' + L('sBoss') : '');
  if (twoFloors) intro += ' ' + L('sTwoFloors');
  if (level === 1 && !dailyMode) intro += ' ' + L('sTutorial');
  else intro += hintsFor().map(h => ' ' + h + '.').join('');
  say(intro);
}

// Logique
// =====================================================================
function update(dt) {
  t += dt;
  const tap = input.tap, cone = input.cone, decoy = input.decoy, beacon = input.beacon, back = input.back, ta = input.titleAction;
  input.tap = input.cone = input.decoy = input.beacon = input.back = false; input.titleAction = -1;
  if (back && state !== TITLE) { goTitle(); say(L('sMenu')); }

  if (state === PLAY && input.touching && !input.moved && !input.aimArmed && performance.now() - input.downTime > C.AIM_DELAY) {
    input.aimArmed = true; haptics.tick(8);
  }

  if (state === TITLE) {
    if (ta >= 0) titleAction(ta);
    else if (tap) titleTap(input.tapX, input.tapY);
    sound.setLoop(0.12, 0.9);
  } else if (state === OPTIONS) {
    if (tap) optionsTap(input.tapX, input.tapY);
    sound.setLoop(0.1, 0.9);
  } else if (state === PLAY) {
    updatePlay(dt, tap, cone, decoy, beacon);
  } else if (state === DEAD) {
    sound.setLoop(0.05, 0.7);
    if (tap && t - stateT > 0.8) startLevel();
  } else if (state === CLEAR) {
    sound.setLoop(0.1, 1.1);
    if (tap && t - stateT > 0.8) { if (dailyMode) goTitle(); else { level++; startLevel(); } }
  }
  const drag = 1 - dt * 2.2;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt;
    if (p.life <= 0) { particles[i] = particles[particles.length - 1]; particles.pop(); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= drag; p.vy *= drag;
  }
  shake = max(0, shake - dt * 2.5);
  beatFlash = max(0, beatFlash - dt * 1.8);
}

// ---------- menus ----------
function titleButtons() {
  const labels = [L('play'), L('daily'), L('options')];
  if (installEvt && !standalone()) labels.push(L('install'));
  const w = min(vw * 0.66, 340), h = 48;
  return labels.map((label, k) => { const cy = vh * (0.58 + k * 0.075); return { label, k, x: vw / 2 - w / 2, y: cy - h / 2, w, h }; });
}
function titleAction(k) {
  if (k === 0) { dailyMode = false; level = 1; startLevel(); }
  else if (k === 1) { // défi figé au lancement : une partie commencée à 23 h 59 reste celle de ce jour
    dailyMode = true; defiJour = Defi.today(); dailySeed = Defi.seed('echo', defiJour.key); dailyBest = store.get('daily_' + defiJour.num, 0); startLevel();
  }
  else if (k === 2) { state = OPTIONS; stateT = t; pushGameHistory(); say(L('sOptions')); }
  else if (k === 3 && installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; }); }
  haptics.tick();
}
function titleTap(x, y) {
  if (audioMode && y < vh * 0.5) { titleAction(0); return; }
  for (const b of titleButtons()) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      if (b.k <= 1 && matchMedia('(pointer: coarse)').matches && !standalone() && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      titleAction(b.k); return;
    }
  }
}
function optionButtons() {
  const top = vh * 0.2, gap = min(84, (vh * 0.93 - 50 - top) / 5), w = min(vw * 0.8, 380), h = min(52, gap - 26);
  const out = [];
  for (let k = 0; k < 6; k++) {
    const cy = k < 5 ? top + k * gap : top + 5 * gap + 10;
    out.push({ k, x: vw / 2 - w / 2, y: cy - h / 2, w, h });
  }
  return out;
}
function optionsTap(x, y) {
  for (const b of optionButtons()) {
    if (!(x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h)) continue;
    if (b.k === 0) { easy = !easy; store.set('easy', easy); say(L(easy ? 'sEasyOn' : 'sEasyOff')); }
    else if (b.k === 1) { realistic = !realistic; store.set('realistic', realistic); say(L(realistic ? 'sRealOn' : 'sRealOff')); }
    else if (b.k === 2) { audioMode = !audioMode; store.set('audio', audioMode); speech.say(L(audioMode ? 'sAudioOn' : 'sAudioOff')); }
    else if (b.k === 3 && tilt.available) {
      gyro = !gyro; store.set('gyro', gyro);
      if (gyro) tilt.start(); else tilt.stop();
      say(L(gyro ? 'sGyroOn' : 'sGyroOff'));
    } else if (b.k === 4) {
      lang = (lang + 1) % I18N.langs.length; store.set('lang', lang);
      document.documentElement.lang = I18N.langs[lang].code;
      say(I18N.langs[lang].name);
    } else if (b.k === 5) { goTitle(); say(L('sMenu')); }
    haptics.tick();
    return;
  }
}

// ---------- partie ----------
const goalX = () => cur.hasExit ? cur.exitX : cur.stairsX;
const goalY = () => cur.hasExit ? cur.exitY : cur.stairsY;

function updatePlay(dt, tap, cone, decoy, beacon) {
  energy = min(C.MAX_ENERGY, energy + dt / (easyOn() ? C.REGEN * 0.8 : C.REGEN));

  // Déplacement : inclinaison, joystick ou clavier
  let tx = 0, ty = 0;
  if (gyro && tilt.has) { if (!input.aimArmed) [tx, ty] = tilt.vector(); }
  else if (input.touching && input.moved && !input.aimArmed) { tx = (input.x - input.ox) / C.JOY_R; ty = (input.y - input.oy) / C.JOY_R; }
  if (!tx && !ty) {
    if (keys.has('arrowleft') || keys.has('a') || keys.has('q')) tx -= 1;
    if (keys.has('arrowright') || keys.has('d')) tx += 1;
    if (keys.has('arrowup') || keys.has('w') || keys.has('z')) ty -= 1;
    if (keys.has('arrowdown') || keys.has('s')) ty += 1;
  }
  const l = hypot(tx, ty); if (l > 1) { tx /= l; ty /= l; }
  const k = min(1, dt * 12);
  vx += (tx * C.SPEED - vx) * k; vy += (ty * C.SPEED - vy) * k;
  px += vx * dt; py += vy * dt;
  if (hypot(vx, vy) > 0.3) facing = atan2(vy, vx);
  collide();
  bumpCd -= dt;
  const push = hypot(pushX, pushY);
  if (push > 0.004 && bumpCd <= 0 && hypot(tx, ty) > 0.3) {
    bumpCd = 0.3;
    const rate = abs(pushY) > abs(pushX) ? (pushY > 0 ? 1.2 : 0.85) : 1;
    sound.play('bump', audioMode ? 0.6 : 0.18, -pushX / push * 0.9, rate);
    if (audioMode) haptics.tick(10);
  }

  if (!trailOn && hypot(px - 0.5, py - 0.5) > 2.5) trailOn = true;
  if (trailOn) {
    trailAcc += dt;
    while (trailAcc >= C.TRAIL_DT) {
      trailAcc -= C.TRAIL_DT;
      const i = trailCount % C.TRAIL_N;
      trailX[i] = px; trailY[i] = py; trailF[i] = floorIdx; trailCount++;
    }
  }

  if (tap) firePulse(RADIAL, facing);
  if (cone) firePulse(CONE, input.coneAngle);
  if (decoy) throwDecoy();
  if (beacon) placeBeacon();
  updateDecoys();
  updatePulses();

  if (answerAt >= 0 && t >= answerAt) { answerAt = -1; hintT = t; playAt('answer', goalX(), goalY(), 0.9); }

  syncReflet();
  floors.forEach((f, fi) => updateHunters(f, fi === floorIdx, dt));
  updateBeacons();

  if (hypot(vx, vy) / C.SPEED > 0.8) {
    for (const h of hunters) if (h.type === RODEUSE && !h.hunting && hypot(h.x - px, h.y - py) < 1.7) alert(cur, h, cellOf(maze, px, py));
  }
  for (const h of hunters) if (h.active && hypot(h.x - px, h.y - py) < radiusOf(h)) { die(); return; }

  for (const s of shards) {
    if (!s.taken && hypot(s.x - px, s.y - py) < 0.4) {
      s.taken = true; shardsTaken++; energy = min(C.MAX_ENERGY, energy + 2);
      sound.play('shard', 0.8); haptics.tick(20); burst(s.x, s.y, 24, 2.2, COL.VIOLET, 0.8, 2.2); say(L('sShard'));
    }
  }

  let nd = 99, anyHunting = false;
  floors.forEach((f, fi) => {
    const here = fi === floorIdx;
    for (const h of f.hunters) {
      if (!h.active) continue;
      const d = hypot(h.x - px, h.y - py);
      if (here) { nd = min(nd, d - (radiusOf(h) - 0.36)); if (h.hunting) anyHunting = true; }
      const step = hypot(h.x - h.lx, h.y - h.ly); h.lx = h.x; h.ly = h.y;
      if (step < 1) h.stepAcc += step;
      if (h.stepAcc > 0.5) {
        h.stepAcc = 0;
        if (here && d < 6) playAt('step', h.x, h.y, (1 - d / 6) * 0.55, (0.85 + Math.random() * 0.3) * (h.type === MERE ? 0.7 : 1));
        else if (!here && d < 5) playAt('step', h.x, h.y, (1 - d / 5) * 0.3, 0.6);
      }
    }
  });
  if (nd < C.BEAT_R) {
    beatTimer -= dt;
    if (beatTimer <= 0) {
      const i = clamp(1 - nd / C.BEAT_R, 0, 1);
      beatTimer = 0.32 + 0.9 * (1 - i);
      haptics.heartbeat(i); sound.play('thump', 0.3 + 0.6 * i);
      beatFlash = max(beatFlash, 0.25 + 0.6 * i);
    }
  } else beatTimer = min(beatTimer, 0.15);
  const danger = clamp(1 - nd / 7, 0, 1);
  sound.setLoop(0.18 + 0.55 * danger + (anyHunting ? 0.12 : 0), 0.95 + 0.2 * danger);

  if (audioMode) audioCues(dt);

  const ds = cur.stairsTo >= 0 ? hypot(cur.stairsX - px, cur.stairsY - py) : 99;
  if (ds > 0.6) stairsArmed = true;
  if (stairsArmed && ds < 0.35) { changeFloor(cur.stairsTo); return; }

  if (cur.hasExit && hypot(cur.exitX - px, cur.exitY - py) < 0.38) { clearLevel(); return; }

  const c = min(1, dt * 6);
  camX += (px - camX) * c; camY += (py - camY) * c;
}

// Mode audio : passages ouverts, direction de l'objectif, éclats proches
function audioCues(dt) {
  scanTimer -= dt;
  if (scanTimer <= 0) {
    scanTimer = 0.8;
    const c = cellOf(maze, px, py);
    let delay = 0;
    for (const d of [N, E, S, W]) {
      if (!maze.isOpen(c, d)) continue;
      const pan = d === E ? 0.9 : d === W ? -0.9 : 0;
      const rate = d === N ? 1.26 : d === S ? 0.8 : 1;
      sound.play('open', 0.35, pan, rate, delay);
      delay += 0.09;
    }
  }
  goalTimer -= dt;
  if (goalTimer <= 0) {
    goalTimer = 2.2;
    const d = hypot(goalX() - px, goalY() - py), dy = goalY() - py;
    playAt('answer', goalX(), goalY(), 0.2 + 0.5 * max(0, 1 - d / 14), dy < -0.5 ? 1.15 : dy > 0.5 ? 0.87 : 1);
  }
  shardTimer -= dt;
  if (shardTimer <= 0) {
    shardTimer = 1.6;
    const s = shards.find(s => !s.taken && hypot(s.x - px, s.y - py) < 3);
    if (s) playAt('shard', s.x, s.y, 0.3);
  }
}

function changeFloor(to) {
  const down = to > floorIdx;
  setFloor(to);
  stairsArmed = false; pulses = []; decoys = []; answerAt = -1; floorBannerT = t;
  sound.play('stairs', 0.8, 0, down ? 1 : 1.25); haptics.tick(30);
  say(L(down ? 'sDown' : 'sUp'));
}

function clearLevel() {
  state = CLEAR; stateT = t;
  sound.play('win'); haptics.success(); burst(cur.exitX, cur.exitY, 40, 3, COL.GOLD, 1.2, 2.5);
  if (dailyMode) {
    dailyTime = t - levelStartT;
    dailyScore = max(0, Math.floor(10000 - dailyTime * 40 - echoesUsed * 120 + shardsTaken * 400));
    if (dailyScore > dailyBest) { dailyBest = dailyScore; newRecord = true; store.set('daily_' + defiJour.num, dailyBest); }
    // 1er appel : série du jour ; 2e : même jour, ne range que le texte qui contient cette série
    defiSt = Defi.record('echo', defiJour, dailyScore, '');
    defiTexte = texteDefi(defiSt.count);
    defiSt = Defi.record('echo', defiJour, dailyScore, defiTexte);
    defiPanneau(true);
    say(L('sDefiFin', nombre(dailyScore), defiSt.count));
  } else {
    stars = echoesUsed <= par3 ? 3 : echoesUsed <= par2 ? 2 : 1;
    if (stars > store.get('stars_' + level, 0)) store.set('stars_' + level, stars);
    if (level > best) { best = level; store.set('best', best); }
    totalStars = sumStars();
    say(stars > 1 ? L('sClearMany', stars) : L('sClearOne'));
  }
}

// ---------- échos ----------
function angleIn(ox, oy, x, y, dir, half) {
  let d = atan2(y - oy, x - ox) - dir;
  while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
  return abs(d) <= half;
}
const inCone = (p, x, y) => p.kind !== CONE || angleIn(p.ox, p.oy, x, y, p.dir, p.half);

function segDist(x, y, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const u = clamp(((x - x1) * dx + (y - y1) * dy) / (dx * dx + dy * dy), 0, 1);
  return hypot(x - (x1 + u * dx), y - (y1 + u * dy));
}
function segCross(ax, ay, bx, by, cx, cy, dx, dy) {
  const rx = bx - ax, ry = by - ay, sx = dx - cx, sy = dy - cy;
  const den = rx * sy - ry * sx;
  if (abs(den) < 1e-9) return false;
  const tt = ((cx - ax) * sy - (cy - ay) * sx) / den, uu = ((cx - ax) * ry - (cy - ay) * rx) / den;
  return tt > 1e-4 && tt < 1 - 1e-4 && uu >= -1e-4 && uu <= 1 + 1e-4;
}
function losClear(ox, oy, tx, ty, list, skip) {
  const minX = min(ox, tx), maxX = max(ox, tx), minY = min(oy, ty), maxY = max(oy, ty);
  for (const w of list) {
    if (w === skip || w.broken) continue;
    if (max(w.x1, w.x2) < minX || min(w.x1, w.x2) > maxX || max(w.y1, w.y2) < minY || min(w.y1, w.y2) > maxY) continue;
    if (segCross(ox, oy, tx, ty, w.x1, w.y1, w.x2, w.y2)) return false;
  }
  return true;
}
// Écho réaliste : le mur est-il visible depuis l'origine (au moins un point dégagé) ?
function wallVisible(w, ox, oy, list) {
  const dx = w.x2 - w.x1, dy = w.y2 - w.y1;
  const uc = clamp(((ox - w.x1) * dx + (oy - w.y1) * dy) / (dx * dx + dy * dy), 0, 1);
  for (const u of [uc, 0.15, 0.5, 0.85]) {
    let sx = w.x1 + u * dx, sy = w.y1 + u * dy;
    const d = hypot(ox - sx, oy - sy);
    if (d > 1e-4) { sx += (ox - sx) / d * 0.03; sy += (oy - sy) / d * 0.03; }
    if (losClear(ox, oy, sx, sy, list, w)) return true;
  }
  return false;
}
const entityVisible = (p, x, y) => !realOn() || losClear(p.ox, p.oy, x, y, walls, null);

function wallInCone(w, ox, oy, dir, half) {
  if (angleIn(ox, oy, w.x1, w.y1, dir, half) || angleIn(ox, oy, w.x2, w.y2, dir, half) || angleIn(ox, oy, w.mx, w.my, dir, half)) return true;
  const dx = w.x2 - w.x1, dy = w.y2 - w.y1;
  const u = clamp(((ox - w.x1) * dx + (oy - w.y1) * dy) / (dx * dx + dy * dy), 0, 1);
  return angleIn(ox, oy, w.x1 + u * dx, w.y1 + u * dy, dir, half);
}

function makePulse(kind, ox, oy, dir) {
  let speed, reveal, hear, half;
  if (kind === CONE) { speed = 11; reveal = C.CONE_R; hear = C.CONE_HEAR; half = C.CONE_HALF; }
  else if (kind === DECOY) { speed = 6; reveal = C.DECOY_R; hear = C.DECOY_HEAR; half = Math.PI; }
  else { speed = C.PULSE_SPEED; reveal = C.PULSE_R; hear = C.HEAR_R; half = Math.PI; }
  const real = realOn();
  const cand = real ? walls.filter(w => !w.broken && segDist(ox, oy, w.x1, w.y1, w.x2, w.y2) <= reveal + 0.5) : null;
  const wallDist = new Float32Array(walls.length);
  for (let i = 0; i < walls.length; i++) {
    const w = walls[i];
    if (w.broken || (kind === CONE && !wallInCone(w, ox, oy, dir, half))) { wallDist[i] = Infinity; continue; }
    const dd = segDist(ox, oy, w.x1, w.y1, w.x2, w.y2);
    wallDist[i] = real && dd <= reveal && !wallVisible(w, ox, oy, cand) ? Infinity : dd;
  }
  return { id: ++pulseSeq, kind, ox, oy, start: t, speed, revealR: reveal, hearR: hear, maxR: max(reveal, hear), dir, half, wallDist };
}

function firePulse(kind, dir) {
  if (energy < 1) { sound.play('empty', 0.6); return; }
  energy -= 1; echoesUsed++;
  pulses.push(makePulse(kind, px, py, dir));
  if (kind === CONE) sound.play('cone', 0.7); else sound.play('ping', 0.9);
  haptics.tick();
  answerAt = t + min(1.4, 0.3 + hypot(goalX() - px, goalY() - py) * 0.05);
  // La Mère entend tout et se nourrit de chaque écho
  for (const h of hunters) if (h.type === MERE) {
    h.growth++; h.hunting = false; alert(cur, h, cellOf(maze, px, py));
    playAt('growl', h.x, h.y, 0.9, max(0.5, 0.75 - h.growth * 0.02));
  }
  // Les Rôdeuses de l'autre étage entendent si tu es juste au-dessus/dessous
  floors.forEach((f, fi) => {
    if (fi === floorIdx) return;
    for (const h of f.hunters) if (h.type === RODEUSE && hypot(h.x - px, h.y - py) < C.FLOOR_HEAR) alert(f, h, cellOf(f.maze, px, py));
  });
}

function blocked(x, y, r) {
  if (x < r || y < r || x > maze.cols - r || y > maze.rows - r) return true;
  for (const w of walls) {
    if (w.broken) continue;
    if (x + r < min(w.x1, w.x2) || x - r > max(w.x1, w.x2) || y + r < min(w.y1, w.y2) || y - r > max(w.y1, w.y2)) continue;
    if (segDist(x, y, w.x1, w.y1, w.x2, w.y2) < r) return true;
  }
  return false;
}

function throwDecoy() {
  if (decoysLeft <= 0) { sound.play('empty', 0.6); return; }
  decoysLeft--;
  const dx = cos(facing), dy = sin(facing);
  let tx = px, ty = py, dist = 0;
  while (dist < C.DECOY_RANGE) {
    const nx = tx + dx * 0.05, ny = ty + dy * 0.05;
    if (blocked(nx, ny, 0.12)) break;
    tx = nx; ty = ny; dist += 0.05;
  }
  decoys.push({ fx: px, fy: py, tx, ty, x: px, y: py, start: t, fired: false });
  sound.play('throw', 0.7); haptics.tick();
}

function placeBeacon() {
  if (beaconsLeft <= 0) { sound.play('empty', 0.6); return; }
  beaconsLeft--;
  cur.beacons.push({ x: px, y: py, alive: true });
  sound.play('beacon', 0.8); haptics.tick(20); burst(px, py, 18, 1.4, COL.ICE, 0.8, 1.8); say(L('sBeaconPlaced'));
}

function updateDecoys() {
  for (let i = decoys.length - 1; i >= 0; i--) {
    const d = decoys[i];
    const k = min(1, (t - d.start) / 0.35);
    d.x = d.fx + (d.tx - d.fx) * k; d.y = d.fy + (d.ty - d.fy) * k;
    if (!d.fired && k >= 1) {
      d.fired = true;
      pulses.push(makePulse(DECOY, d.tx, d.ty, 0));
      playAt('ping', d.tx, d.ty, 0.8, 0.8);
      burst(d.tx, d.ty, 14, 1.5, COL.GOLD, 0.6, 1.8);
    }
    if (t - d.start > 3) decoys.splice(i, 1);
  }
}

function updatePulses() {
  const f = cur;
  for (let pi = pulses.length - 1; pi >= 0; pi--) {
    const p = pulses[pi];
    const r = (t - p.start) * p.speed;
    if (r <= p.revealR + 0.3) {
      for (let i = 0; i < walls.length; i++) {
        const w = walls[i];
        if (w.broken || w.lastPulse === p.id) continue;
        const d = p.wallDist[i];
        if (d <= r && d <= p.revealR) {
          w.lit = t; w.seen = true; w.lastPulse = p.id;
          if (Math.random() < 0.35) spark(w);
          if (w.fragile && d <= C.BREAK_R) breakWall(w);
        }
      }
    }
    for (const h of hunters) {
      if (!h.active || h.lastPulse === p.id) continue;
      const d = hypot(h.x - p.ox, h.y - p.oy), mm = h.type === MERE ? 2 : 1;
      if (d <= r && d <= p.maxR * mm) {
        h.lastPulse = p.id;
        if (d <= p.revealR && inCone(p, h.x, h.y) && entityVisible(p, h.x, h.y)) h.lit = t;
        const hears = h.type === RODEUSE || (h.type === MERE && p.kind === DECOY);
        if (hears && d <= p.hearR * mm) alert(f, h, cellOf(maze, p.ox, p.oy));
      }
    }
    for (const s of shards) {
      if (s.taken || s.lastPulse === p.id) continue;
      const d = hypot(s.x - p.ox, s.y - p.oy);
      if (d <= r && d <= p.revealR && inCone(p, s.x, s.y) && entityVisible(p, s.x, s.y)) { s.lit = t; s.lastPulse = p.id; }
    }
    if (f.hasExit && f.exitLastPulse !== p.id) {
      const d = hypot(f.exitX - p.ox, f.exitY - p.oy);
      if (d <= r && d <= p.revealR && inCone(p, f.exitX, f.exitY) && entityVisible(p, f.exitX, f.exitY)) { f.exitLit = t; f.exitLastPulse = p.id; }
    }
    if (f.stairsTo >= 0 && f.stairsLastPulse !== p.id) {
      const d = hypot(f.stairsX - p.ox, f.stairsY - p.oy);
      if (d <= r && d <= p.revealR && inCone(p, f.stairsX, f.stairsY) && entityVisible(p, f.stairsX, f.stairsY)) { f.stairsLit = t; f.stairsLastPulse = p.id; }
    }
    if (r > p.maxR * 2) pulses.splice(pi, 1);
  }
}

function breakWall(w) {
  w.broken = true; maze.open(w.a, w.b);
  playAt('crack', w.mx, w.my, 1); haptics.tick(45);
  shake = max(shake, 0.35); burst(w.mx, w.my, 28, 2.5, COL.CRACK, 1, 2.2);
  const target = cellOf(maze, w.mx, w.my);
  for (const h of hunters) if ((h.type === RODEUSE || h.type === MERE) && hypot(h.x - w.mx, h.y - w.my) < C.BREAK_NOISE) alert(cur, h, target);
}

// ---------- Ombres ----------
function alert(f, h, target) {
  const m = f.maze, c = cellOf(m, h.x, h.y);
  h.path = [c, ...m.path(c, target)];
  if (!h.hunting && f === cur && h.type !== MERE) {
    const d = hypot(h.x - px, h.y - py);
    playAt('growl', h.x, h.y, 0.25 + 0.6 * max(0, 1 - d / C.HEAR_R));
  }
  h.hunting = true;
}

function moveToward(m, h, target, speed, dt) {
  const tx = ccx(m, target), ty = ccy(m, target), dx = tx - h.x, dy = ty - h.y, d = hypot(dx, dy), step = speed * dt;
  if (d <= step) {
    h.x = tx; h.y = ty;
    if (target !== h.atCell) { h.prevCell = h.atCell; h.atCell = target; }
    return true;
  }
  h.x += dx / d * step; h.y += dy / d * step;
  return false;
}

function followPath(f, h, speed, dt) {
  const m = f.maze;
  if (!h.path.length) {
    h.hunting = false;
    if (h.type === RODEUSE || h.type === MERE) {
      const b = f.beacons.find(b => b.alive && hypot(b.x - h.x, b.y - h.y) < C.BEACON_LURE);
      if (b) h.path = m.path(h.atCell, cellOf(m, b.x, b.y));
    }
    if (!h.path.length) {
      const n = m.neighbors(h.atCell, nb);
      if (!n) return;
      let pick = nb[Math.floor(Math.random() * n)];
      if (n > 1) { let g = 0; while (pick === h.prevCell && g++ < 6) pick = nb[Math.floor(Math.random() * n)]; }
      h.path.push(pick);
    }
  }
  if (moveToward(m, h, h.path[0], speed, dt)) h.path.shift();
}

// Le Reflet suit ta piste, y compris d'un étage à l'autre
function syncReflet() {
  const r = reflet;
  if (!r || trailCount <= C.REFLET_DELAY) return;
  const i = (trailCount - C.REFLET_DELAY) % C.TRAIL_N, tf = trailF[i];
  floors.forEach((f, fi) => {
    if (fi === tf) return;
    const j = f.hunters.indexOf(r);
    if (j >= 0) { f.hunters.splice(j, 1); floors[tf].hunters.push(r); }
  });
  if (!r.active) { r.active = true; r.lx = trailX[i]; r.ly = trailY[i]; }
  r.x = trailX[i]; r.y = trailY[i];
}

function updateHunters(f, onFloor, dt) {
  const m = f.maze, mul = easyOn() ? 0.85 : 1, lv = dailyMode ? 6 : level;
  const huntSpeed = min(2.3, 1.65 + lv * 0.06) * mul;
  const playerMoving = onFloor && hypot(vx, vy) > 0.35 * C.SPEED;
  for (const h of f.hunters) {
    if (h.type === REFLET) continue;
    if (h.type === PATROUILLE) {
      const route = h.route;
      if (route && route.length > 1 && moveToward(m, h, route[h.routeIdx], 1.1 * mul, dt)) {
        if (h.routeIdx + h.routeDir < 0 || h.routeIdx + h.routeDir >= route.length) h.routeDir = -h.routeDir;
        h.routeIdx += h.routeDir;
      }
    } else if (h.type === AVEUGLE) {
      const d = hypot(h.x - px, h.y - py);
      if (playerMoving && d < 2.8) {
        h.senseTimer -= dt;
        if (h.senseTimer <= 0) { h.senseTimer = 0.4; alert(f, h, cellOf(m, px, py)); }
      } else h.senseTimer = 0;
      followPath(f, h, (h.hunting ? 1.9 : 0.55) * mul, dt);
    } else if (h.type === MERE) {
      followPath(f, h, (h.hunting ? min(2.4, 0.7 + 0.12 * h.growth) : 0.5) * mul, dt);
    } else {
      followPath(f, h, h.hunting ? huntSpeed : 0.75 * mul, dt);
    }
  }
}

// Les Rôdeuses (et la Mère) qui atteignent une balise l'éteignent
function updateBeacons() {
  floors.forEach((f, fi) => {
    for (const b of f.beacons) {
      if (!b.alive) continue;
      for (const h of f.hunters) {
        if ((h.type === RODEUSE || h.type === MERE) && hypot(h.x - b.x, h.y - b.y) < 0.35) {
          b.alive = false;
          if (fi === floorIdx) { playAt('snuff', b.x, b.y, 0.8); burst(b.x, b.y, 20, 1.6, COL.ICE, 0.9, 1.8); }
          else playAt('snuff', b.x, b.y, 0.3, 0.7);
          say(L('sBeaconOut'));
          break;
        }
      }
    }
  });
}

function collide() {
  pushX = 0; pushY = 0;
  for (let pass = 0; pass < 2; pass++) {
    for (const w of walls) {
      if (w.broken) continue;
      if (px + C.PR < min(w.x1, w.x2) || px - C.PR > max(w.x1, w.x2) || py + C.PR < min(w.y1, w.y2) || py - C.PR > max(w.y1, w.y2)) continue;
      const dx2 = w.x2 - w.x1, dy2 = w.y2 - w.y1;
      const u = clamp(((px - w.x1) * dx2 + (py - w.y1) * dy2) / (dx2 * dx2 + dy2 * dy2), 0, 1);
      const dx = px - (w.x1 + u * dx2), dy = py - (w.y1 + u * dy2), d = hypot(dx, dy);
      if (d < C.PR && d > 1e-5) { const push = (C.PR - d) / d; px += dx * push; py += dy * push; pushX += dx * push; pushY += dy * push; }
    }
  }
  px = clamp(px, C.PR, maze.cols - C.PR); py = clamp(py, C.PR, maze.rows - C.PR);
}

function die() {
  state = DEAD; stateT = t;
  for (const h of hunters) h.lit = t + 2;
  sound.play('death'); haptics.boom(); shake = 1; vx = 0; vy = 0;
  burst(px, py, 40, 3.5, COL.RED, 1.1, 2.5);
  say(L('sDead'));
}

function playAt(name, x, y, vol, rate = 1) {
  const dx = x - px, d = max(0.001, hypot(dx, y - py));
  sound.play(name, vol, clamp(dx / d, -1, 1) * 0.85, rate);
}

function burst(x, y, count, speed, color, life, size) {
  for (let i = 0; i < count && particles.length < 600; i++) {
    const a = Math.random() * TAU, s = speed * (0.3 + Math.random() * 0.7), l = life * (0.5 + Math.random() * 0.5);
    particles.push({ x, y, vx: cos(a) * s, vy: sin(a) * s, life: l, maxLife: l, color, size });
  }
}
function spark(w) {
  if (particles.length >= 600) return;
  const u = Math.random(), a = Math.random() * TAU, l = 0.5 + Math.random() * 0.5;
  particles.push({ x: w.x1 + (w.x2 - w.x1) * u, y: w.y1 + (w.y2 - w.y1) * u, vx: cos(a) * 0.35, vy: sin(a) * 0.35,
    life: l, maxLife: l, color: w.fragile ? COL.CRACK : COL.CYAN, size: 1.4 });
}

// =====================================================================
// Rendu
// =====================================================================
const fade = (lit, dur) => clamp(1 - (t - lit) / dur, 0, 1);
const sx = x => (x - camX) * cell + vw / 2 + shakeX;
const sy = y => (y - camY) * cell + vh / 2 + shakeY;

function fillCircle(x, y, r, color, a) { ctx.globalAlpha = clamp(a, 0, 1); ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, max(0, r), 0, TAU); ctx.fill(); }
function strokeCircle(x, y, r, color, a, w) { ctx.globalAlpha = clamp(a, 0, 1); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, max(0, r), 0, TAU); ctx.stroke(); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function text(s, x, y, size, color, a, align = 'center', ls = 0) {
  ctx.font = `300 ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  if ('letterSpacing' in ctx) ctx.letterSpacing = (ls * size).toFixed(1) + 'px';
  // Réduit la taille si le texte dépasse la place disponible (langues longues, petits écrans)
  const avail = align === 'center' ? 2 * min(x, vw - x) - 24 : align === 'left' ? vw - x - 12 : x - 12;
  const w = ctx.measureText(s).width;
  if (w > avail && avail > 0) {
    const k = avail / w;
    ctx.font = `300 ${size * k}px ${FONT}`;
    if ('letterSpacing' in ctx) ctx.letterSpacing = (ls * size * k).toFixed(1) + 'px';
  }
  ctx.globalAlpha = clamp(a, 0, 1); ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function diamond(x, y, r, rot, color, a) {
  ctx.globalAlpha = clamp(a, 0, 1); ctx.fillStyle = color; ctx.beginPath();
  for (let k = 0; k < 4; k++) { const ang = rot + k * Math.PI / 2; const qx = x + cos(ang) * r, qy = y + sin(ang) * r; k ? ctx.lineTo(qx, qy) : ctx.moveTo(qx, qy); }
  ctx.closePath(); ctx.fill();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function formatTime(s) { const m = Math.floor(s / 60); const r = s - m * 60; const sep = (1.5).toLocaleString(I18N.langs[lang].tts).charAt(1) || '.'; return String(m).padStart(2, '0') + ':' + r.toFixed(1).padStart(4, '0').replace('.', sep); }

function beaconLight(x, y) {
  let a = 0;
  for (const b of cur.beacons) {
    if (!b.alive) continue;
    const d = hypot(x - b.x, y - b.y);
    if (d < C.BEACON_LIGHT) a = max(a, 0.15 + 0.35 * (1 - d / C.BEACON_LIGHT));
  }
  return a;
}

function render() {
  majLienLegal();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 1; ctx.fillStyle = COL.BG; ctx.fillRect(0, 0, vw, vh);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (state === TITLE) { renderTitle(); return; }
  if (state === OPTIONS) { renderOptions(); return; }
  shakeX = shake > 0 ? (Math.random() - 0.5) * shake * 24 : 0;
  shakeY = shake > 0 ? (Math.random() - 0.5) * shake * 24 : 0;
  if (audioMode) renderAudioWorld(); else renderWorld();
  renderHud();
  if (state === DEAD) renderOverlay(L('deadTitle'), COL.RED, null, [L('retry')]);
  else if (state === CLEAR) {
    if (dailyMode) { const r = avantProchain(); renderOverlay(L('dailyWin'), COL.GOLD, null, [
      L('dailyLine', formatTime(dailyTime), echoesUsed, shardsTaken, shardsTotal),
      L('score', dailyScore) + (newRecord ? L('newRecord') : L('recordWas', dailyBest)),
      L('defiSerie', defiSt.count, defiSt.best), L('defiProchain', Math.floor(r / 3600000), String(Math.floor(r % 3600000 / 60000)).padStart(2, '0')),
      '', L('toMenu')], 0.2); }
    else renderOverlay(L('clearTitle'), COL.GOLD, stars, [L('clearLine', level, echoesUsed, par3), '', L('deeper')]);
  }
  ctx.globalAlpha = 1;
}

function renderAudioWorld() {
  const pxs = sx(px), pys = sy(py);
  for (const p of pulses) {
    const r = (t - p.start) * p.speed;
    if (r <= p.revealR) strokeCircle(sx(p.ox), sy(p.oy), r * cell, COL.CYAN, (1 - r / p.revealR) * 0.3, 2);
  }
  fillCircle(pxs, pys, cell * 0.4, COL.WHITE, 0.08);
  fillCircle(pxs, pys, cell * 0.09, COL.WHITE, 0.8);
  text(L('audioLabel'), vw / 2, vh * 0.78, 11, COL.WHITE, 0.5, 'center', 0.4);
  const va = state === DEAD ? min(0.55, (t - stateT) * 2) : beatFlash * 0.55;
  if (va > 0.01) { ctx.globalAlpha = va; ctx.fillStyle = vignette; ctx.fillRect(0, 0, vw, vh); }
  ctx.globalAlpha = 1;
}

function renderWorld() {
  const dead = state === DEAD, f = cur;
  const halfW = vw / 2 / cell + 1, halfH = vh / 2 / cell + 1;
  const glowW = cell * 0.13, coreW = max(1.5, cell * 0.035);

  for (const b of f.beacons) if (b.alive) fillCircle(sx(b.x), sy(b.y), cell * C.BEACON_LIGHT, COL.ICE, 0.05);

  for (const w of walls) {
    if (w.broken || abs(w.mx - camX) > halfW || abs(w.my - camY) > halfH) continue;
    const md = hypot(w.mx - px, w.my - py);
    let a = max(fade(w.lit, C.WALL_FADE), md < 1.3 ? (1.3 - md) / 1.3 * 0.3 : 0, beaconLight(w.mx, w.my));
    if (easyOn() && w.seen) a = max(a, 0.09);
    if (a <= 0.01) continue;
    const x1 = sx(w.x1), y1 = sy(w.y1), x2 = sx(w.x2), y2 = sy(w.y2);
    const col = w.fragile ? COL.CRACK : COL.CYAN;
    ctx.globalAlpha = a * 0.22; ctx.strokeStyle = col; ctx.lineWidth = glowW; line(x1, y1, x2, y2);
    ctx.globalAlpha = a; ctx.strokeStyle = t - w.lit < 0.18 ? COL.WHITE : col; ctx.lineWidth = coreW;
    if (w.fragile) {
      const nx = -(y2 - y1) * 0.08, ny = (x2 - x1) * 0.08;
      const ax = x1 + (x2 - x1) * 0.35 + nx, ay = y1 + (y2 - y1) * 0.35 + ny;
      const bx = x1 + (x2 - x1) * 0.65 - nx, by = y1 + (y2 - y1) * 0.65 - ny;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(x2, y2); ctx.stroke();
    } else line(x1, y1, x2, y2);
  }

  for (const p of pulses) {
    const r = (t - p.start) * p.speed;
    if (r > p.revealR) continue;
    const a = 1 - r / p.revealR, col = p.kind === DECOY ? COL.GOLD : COL.CYAN, ox = sx(p.ox), oy = sy(p.oy);
    if (p.kind === CONE) {
      ctx.globalAlpha = a * 0.7; ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ox, oy, r * cell, p.dir - p.half, p.dir + p.half); ctx.stroke();
    } else {
      strokeCircle(ox, oy, r * cell, col, a * 0.55, 2);
      if (r > 0.5) strokeCircle(ox, oy, (r - 0.5) * cell, col, a * 0.18, 2);
    }
  }

  if (f.hasExit) {
    const ed = hypot(f.exitX - px, f.exitY - py);
    const ea = max(fade(f.exitLit, 3.2), ed < 1.6 ? (1.6 - ed) / 1.6 * 0.8 : 0, beaconLight(f.exitX, f.exitY) * 1.6);
    if (ea > 0) {
      const ex = sx(f.exitX), ey = sy(f.exitY);
      for (let k = 0; k < 3; k++) { const ph = (t * 0.6 + k / 3) % 1; strokeCircle(ex, ey, cell * (0.12 + ph * 0.38), COL.GOLD, ea * (1 - ph) * 0.8, 2); }
      diamond(ex, ey, cell * 0.11, t * 1.5, COL.GOLD, ea);
    }
  }

  if (f.stairsTo >= 0) {
    const sd = hypot(f.stairsX - px, f.stairsY - py);
    const sa = max(fade(f.stairsLit, 3.2), sd < 1.6 ? (1.6 - sd) / 1.6 * 0.8 : 0, beaconLight(f.stairsX, f.stairsY) * 1.6);
    if (sa > 0) {
      const sxp = sx(f.stairsX), syp = sy(f.stairsY), down = f.stairsTo > floorIdx;
      ctx.lineWidth = 2; ctx.strokeStyle = COL.STAIRS;
      for (let k = 0; k < 3; k++) {
        const r = cell * (0.32 - k * 0.09), rot = t * (down ? 1 : -1) + k * 0.4;
        ctx.globalAlpha = clamp(sa * (0.4 + k * 0.3), 0, 1); ctx.beginPath();
        for (let q = 0; q < 4; q++) { const ang = rot + q * Math.PI / 2; const x = sxp + cos(ang) * r, y = syp + sin(ang) * r; q ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
        ctx.closePath(); ctx.stroke();
      }
      text(down ? '▼' : '▲', sxp, syp + 4, 12, COL.STAIRS, sa * 0.86);
    }
  }

  for (const s of shards) {
    if (s.taken) continue;
    const d = hypot(s.x - px, s.y - py);
    const a = max(fade(s.lit, 3.5), d < 1.3 ? (1.3 - d) / 1.3 : 0, beaconLight(s.x, s.y) * 1.6);
    if (a <= 0.01) continue;
    fillCircle(sx(s.x), sy(s.y), cell * 0.2, COL.VIOLET, a * 0.25);
    diamond(sx(s.x), sy(s.y), cell * 0.08, t * 2, COL.VIOLET, a);
  }

  for (const b of f.beacons) {
    const bx = sx(b.x), by = sy(b.y);
    if (b.alive) {
      const pulse = 0.8 + 0.2 * sin(t * 4 + b.x);
      fillCircle(bx, by, cell * 0.22, COL.ICE, 0.18 * pulse);
      fillCircle(bx, by, cell * 0.06, COL.ICE, pulse);
      strokeCircle(bx, by, cell * 0.13, COL.ICE, 0.6 * pulse, 1.5);
    } else strokeCircle(bx, by, cell * 0.08, COL.ICE, 0.12, 1);
  }

  for (const d of decoys) diamond(sx(d.x), sy(d.y), cell * 0.07, t * 6, COL.GOLD, d.fired ? fade(d.start + 0.35, 2.65) : 1);

  for (const h of hunters) {
    if (!h.active) continue;
    const d = hypot(h.x - px, h.y - py), rad = radiusOf(h);
    let a = dead ? 1 : max(fade(h.lit, 1.2), d < 1.2 + rad ? (1.2 + rad - d) / 1.2 * 0.7 : 0);
    a = max(a, beaconLight(h.x, h.y) * 1.5);
    if (a > 0.01) drawHunter(h, sx(h.x), sy(h.y), min(1, a));
  }

  for (const p of particles) fillCircle(sx(p.x), sy(p.y), p.size, p.color, p.life / p.maxLife);

  const br = 1 + 0.06 * sin(t * 3), pxs = sx(px), pys = sy(py);
  fillCircle(pxs, pys, cell * 0.55 * br, COL.WHITE, 0.05);
  fillCircle(pxs, pys, cell * 0.3 * br, COL.WHITE, 0.12);
  fillCircle(pxs, pys, cell * 0.11, COL.WHITE, dead ? 0.3 : 1);

  if (input.aimArmed && state === PLAY) {
    const dx = input.x - input.ox, dy = input.y - input.oy;
    ctx.lineWidth = 1.5; ctx.strokeStyle = COL.CYAN;
    if (hypot(dx, dy) > 20) {
      const ang = atan2(dy, dx), len = C.CONE_R * cell * 0.45;
      ctx.globalAlpha = 0.45;
      ctx.beginPath(); ctx.moveTo(pxs + cos(ang - C.CONE_HALF) * len, pys + sin(ang - C.CONE_HALF) * len); ctx.lineTo(pxs, pys);
      ctx.lineTo(pxs + cos(ang + C.CONE_HALF) * len, pys + sin(ang + C.CONE_HALF) * len); ctx.stroke();
      ctx.beginPath(); ctx.arc(pxs, pys, len, ang - C.CONE_HALF, ang + C.CONE_HALF); ctx.stroke();
    } else strokeCircle(pxs, pys, cell * 0.45, COL.CYAN, 0.25 + 0.15 * sin(t * 10), 1.5);
    text(L('aim'), vw / 2, vh * 0.74, 11, COL.CYAN, 0.8, 'center', 0.3);
  }

  const ha = fade(hintT, 1.3);
  if (ha > 0 && state === PLAY) {
    const ang = atan2(goalY() - py, goalX() - px), rad = min(vw, vh) * 0.4;
    const hx = vw / 2 + cos(ang) * rad, hy = vh / 2 + sin(ang) * rad, s = 11;
    ctx.globalAlpha = ha * 0.9; ctx.fillStyle = f.hasExit ? COL.GOLD : COL.STAIRS; ctx.beginPath();
    ctx.moveTo(hx + cos(ang) * s * 1.4, hy + sin(ang) * s * 1.4);
    ctx.lineTo(hx + cos(ang + 2.4) * s, hy + sin(ang + 2.4) * s);
    ctx.lineTo(hx + cos(ang - 2.4) * s, hy + sin(ang - 2.4) * s);
    ctx.closePath(); ctx.fill();
  }

  if (input.touching && input.moved && !input.aimArmed && !gyro && state === PLAY) {
    strokeCircle(input.ox, input.oy, C.JOY_R, COL.WHITE, 0.12, 1.5);
    fillCircle(input.x, input.y, 18, COL.WHITE, 0.18);
  }

  const va = dead ? min(0.55, (t - stateT) * 2) : beatFlash * 0.55;
  if (va > 0.01) { ctx.globalAlpha = va; ctx.fillStyle = vignette; ctx.fillRect(0, 0, vw, vh); }
  ctx.globalAlpha = 1;
}

function drawHunter(h, hx, hy, a) {
  if (h.type === PATROUILLE) {
    fillCircle(hx, hy, cell * 0.34, COL.PINK, a * 0.18);
    ctx.globalAlpha = a; ctx.strokeStyle = COL.PINK; ctx.lineWidth = 2.5; ctx.beginPath();
    for (let k = 0; k < 4; k++) { const ang = t * 2 + k * Math.PI / 2; const x = hx + cos(ang) * cell * 0.22, y = hy + sin(ang) * cell * 0.22; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.closePath(); ctx.stroke();
    fillCircle(hx, hy, cell * 0.07, COL.PINK, a);
  } else if (h.type === AVEUGLE) {
    for (let k = 0; k < 3; k++) { const ph = (t * 1.2 + k / 3) % 1; strokeCircle(hx, hy, cell * (0.12 + ph * 0.3), COL.ORANGE, a * (1 - ph) * 0.7, 1.5); }
    fillCircle(hx, hy, cell * (0.15 + 0.02 * sin(t * 6)), COL.ORANGE, a);
  } else if (h.type === REFLET) {
    fillCircle(hx, hy, cell * 0.4, COL.PALE, a * 0.15);
    strokeCircle(hx, hy, cell * 0.16, COL.RED, a * 0.8, 2);
    fillCircle(hx, hy, cell * 0.1, COL.PALE, a);
  } else if (h.type === MERE) {
    const R = cell * radiusOf(h) * 0.9;
    fillCircle(hx, hy, R * 1.5, COL.MOTHER, a * 0.35);
    ctx.globalAlpha = a; ctx.fillStyle = COL.RED; ctx.beginPath();
    const n = 22;
    for (let k = 0; k < n; k++) {
      const ang = k * TAU / n - t * 0.5, rr = R * (k % 2 === 0 ? 1 + 0.12 * sin(t * 5 + k) : 0.55);
      const x = hx + cos(ang) * rr, y = hy + sin(ang) * rr; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.fill();
    fillCircle(hx, hy, R * 0.3, COL.VIOLET, a * (0.7 + 0.3 * sin(t * 3)));
    fillCircle(hx, hy, R * 0.12, COL.BG, a);
  } else {
    fillCircle(hx, hy, cell * 0.34, COL.RED, a * 0.2);
    ctx.globalAlpha = a; ctx.fillStyle = COL.RED; ctx.beginPath();
    const n = 14;
    for (let k = 0; k < n; k++) {
      const ang = k * TAU / n + t * 0.8, rr = cell * 0.22 * (k % 2 === 0 ? 1 : 0.6 + 0.2 * sin(t * 9 + k));
      const x = hx + cos(ang) * rr, y = hy + sin(ang) * rr; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.fill();
    fillCircle(hx, hy, cell * 0.06, COL.BG, a);
  }
}

function toolButton(bx, col, left, label, isDiamond) { // label déjà traduit, compteur inclus
  const by = buttonY(), av = left > 0 ? 1 : 0.3;
  fillCircle(bx, by, 32, col, 0.07 * av);
  strokeCircle(bx, by, 32, col, 0.7 * av, 1.5);
  strokeCircle(bx, by, 16, col, 0.45 * av, 1.5);
  if (isDiamond) diamond(bx, by, 6, Math.PI / 4, col, av); else fillCircle(bx, by, 5, col, av);
  text(label, bx, by + 48, 10, col, av * 0.8, 'center', 0.2);
}

function renderHud() {
  const top = 44, m = 22;
  if (dailyMode) {
    text(L('daily'), m, top, 13, COL.WHITE, 0.82, 'left', 0.25);
    text(`⏱ ${formatTime(state === CLEAR ? dailyTime : t - levelStartT)}   ◆ ${shardsTaken}/${shardsTotal}`, m, top + 20, 11, COL.GOLD, 0.78, 'left', 0.25);
  } else {
    const floorTxt = floors.length > 1 ? ' · ' + L('floor', floorIdx + 1, floors.length) : '';
    text(L('level', level) + floorTxt + (easyOn() ? ' · ' + L('easyTag') : ''), m, top, 13, COL.WHITE, 0.82, 'left', 0.25);
    text('◆ ' + L('shards', shardsTaken, shardsTotal), m, top + 20, 11, COL.VIOLET, 0.75, 'left', 0.25);
  }
  const mother = hunters.find(h => h.type === MERE);
  if (mother) text(L('mother', mother.growth), m, top + 38, 11, COL.RED, 0.78, 'left', 0.25);

  const r = 5, gap = 18;
  for (let i = 0; i < C.MAX_ENERGY; i++) {
    const x = vw - m - (C.MAX_ENERGY - 1 - i) * gap, y = top - 4;
    if (energy >= i + 1) fillCircle(x, y, r, COL.CYAN, 1);
    else {
      strokeCircle(x, y, r, COL.CYAN, 0.25, 1.5);
      if (i === Math.floor(energy)) {
        ctx.globalAlpha = 0.9; ctx.strokeStyle = COL.CYAN; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + TAU * (energy - i)); ctx.stroke();
      }
    }
  }
  text(L('echoes', echoesUsed), vw - m + r, top + 20, 11, COL.CYAN, 0.6, 'right', 0.25);

  if (state === PLAY) {
    if (decoysMax > 0) toolButton(decoyX(), COL.GOLD, decoysLeft, L('decoy', decoysLeft), true);
    if (beaconsMax > 0) toolButton(beaconX(), COL.ICE, beaconsLeft, L('beacon', beaconsLeft), false);
  }

  const since = t - levelStartT;
  if (state === PLAY && since < 2.4) {
    const a = since < 0.3 ? since / 0.3 : min(1, (2.4 - since) / 0.8);
    const label = dailyMode ? L('daily') : isBoss() ? L('motherBanner') : L('level', level);
    text(label, vw / 2, vh * 0.3, dailyMode || isBoss() ? 22 : 30, dailyMode ? COL.GOLD : isBoss() ? COL.RED : COL.WHITE, a * 0.9, 'center', 0.5);
  }
  const fs = t - floorBannerT;
  if (state === PLAY && fs < 1.6) text(L('floorBanner', floorIdx + 1), vw / 2, vh * 0.3, 22, COL.STAIRS, min(1, (1.6 - fs) / 0.6) * 0.9, 'center', 0.5);
  const hints = hintsFor();
  if (state === PLAY && hints.length && since < 11 && !input.aimArmed && !audioMode) {
    const a = min(1, (11 - since) / 1.5) * min(1, since / 0.8);
    hints.forEach((l, k) => text(l, vw / 2, vh * 0.62 + k * 22, 13, COL.WHITE, a * 0.67, 'center', 0.05));
  }
  ctx.globalAlpha = 1;
}

function renderOverlay(title, col, starCount, lines, top = 0.42) {
  const a = min(1, (t - stateT) * 1.5);
  ctx.globalAlpha = a * 0.6; ctx.fillStyle = COL.BLACK; ctx.fillRect(0, 0, vw, vh);
  text(title, vw / 2, vh * top, 24, col, a, 'center', 0.3);
  let y = vh * top + 34;
  if (starCount !== null) {
    for (let k = 0; k < 3; k++) {
      const sa = clamp((t - stateT - 0.3 - k * 0.25) / 0.2, 0, 1);
      text(k < starCount ? '★' : '☆', vw / 2 + (k - 1) * 40, y + 8, 30, k < starCount ? COL.GOLD : COL.WHITE, sa * a * (k < starCount ? 1 : 0.2));
    }
    y += 44;
  }
  lines.forEach((l, k) => text(l, vw / 2, y + k * 20, 13, COL.WHITE, a * 0.75, 'center', 0.06));
  ctx.globalAlpha = 1;
}

function renderTitle() {
  const cx = vw / 2, cy = vh * 0.22, span = min(vw, 520);
  for (let k = 0; k < 4; k++) { const ph = (t * 0.3 + k / 4) % 1; strokeCircle(cx, cy, ph * span * 0.7, COL.CYAN, (1 - ph) * 0.5, 1.5); }
  const ga = (sin(t * 0.7) * 0.5 + 0.5) * 0.6;
  fillCircle(cx + span * 0.3 * cos(t * 0.25), cy + span * 0.22 * sin(t * 0.31), 4, COL.RED, ga);
  fillCircle(cx, cy, 18, COL.WHITE, 0.15);
  fillCircle(cx, cy, 7, COL.WHITE, 1);

  text('ÉCHO', cx + 8, vh * 0.43, min(58, vw * 0.15), COL.WHITE, 1, 'center', 0.55);
  text(L('tagline'), cx, vh * 0.43 + 34, 15, COL.WHITE, 0.67, 'center', 0.08);

  const colors = [COL.CYAN, COL.GOLD, COL.WHITE, COL.WHITE];
  for (const b of titleButtons()) {
    const col = colors[b.k];
    roundRect(b.x, b.y, b.w, b.h, 24);
    ctx.globalAlpha = b.k === 0 ? 0.10 : 0.05; ctx.fillStyle = col; ctx.fill();
    ctx.globalAlpha = b.k >= 2 ? 0.35 : 0.7; ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
    text(b.label, b.x + b.w / 2 + 2, b.y + b.h / 2 + 5, b.k >= 2 ? 13 : 15, col, 0.9, 'center', 0.3);
  }

  const info = [];
  if (best > 0) info.push([L('record', best, totalStars), COL.WHITE, 0.5]);
  if (!accueil || Defi.parisDate().num !== accueil.j.num) majAccueil(); // minuit de Paris passé pendant l'accueil
  info.push([accueil.fait ? L('defiFait', accueil.j.n, nombre(accueil.score)) : L('defiAFaire', accueil.j.n), COL.GOLD, 0.85, accueil.serie]);
  info.push([audioMode ? L('audioMenuHint') : L('headphones'), COL.GOLD, 0.67]);
  if (!matchMedia('(pointer: coarse)').matches) info.push([L('keyboard'), COL.CYAN, 0.55]);
  info.forEach((l, k) => {
    const y = vh * 0.88 + k * 18, suite = l[3] > 0 ? '      ' + l[3] : '';
    text(l[0] + suite, cx, y, 11, l[1], l[2], 'center', 0.1);
    if (suite) { const w = ctx.measureText(l[0] + suite).width; flamme(cx - w / 2 + ctx.measureText(l[0] + '   ').width, y - 4, 5.5, l[2]); }
  });
  ctx.globalAlpha = 1;
}

function majLienLegal() {
  const lienLegal = document.getElementById('lienLegal');
  const voir = state === OPTIONS;
  if (voir && lienLegal.textContent !== L('legal')) lienLegal.textContent = L('legal');
  if (lienLegal.hidden === voir) lienLegal.hidden = !voir;
}

function renderOptions() {
  text(L('options'), vw / 2, vh * 0.11, 26, COL.WHITE, 0.9, 'center', 0.5);
  const names = [L('optEasy'), L('optReal'), L('optAudio'), L('optGyro'), L('optLang')];
  const desc = [L('descEasy'), L('descReal'), L('descAudio'), tilt.available ? L('descGyro') : L('descGyroNA'), L('descLang')];
  const on = [easy, realistic, audioMode, gyro, true];
  const values = [easy, realistic, audioMode, gyro].map(v => L(v ? 'yes' : 'no')).concat([I18N.langs[lang].name]);
  const cols = [COL.VIOLET, COL.CYAN, COL.GOLD, COL.ICE, COL.WHITE];
  for (const b of optionButtons()) {
    if (b.k === 5) {
      roundRect(b.x, b.y, b.w, b.h, 26); ctx.globalAlpha = 0.35; ctx.strokeStyle = COL.WHITE; ctx.lineWidth = 1.5; ctx.stroke();
      text(L('back'), b.x + b.w / 2, b.y + b.h / 2 + 5, 13, COL.WHITE, 0.8, 'center', 0.3);
      continue;
    }
    const col = b.k === 3 && !tilt.available ? COL.GRAY : cols[b.k];
    const lit = on[b.k] && b.k !== 4;
    roundRect(b.x, b.y, b.w, b.h, 26);
    ctx.globalAlpha = lit ? 0.12 : 0.03; ctx.fillStyle = col; ctx.fill();
    ctx.globalAlpha = lit || b.k === 4 ? 0.8 : 0.3; ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
    text(names[b.k], b.x + 22, b.y + b.h / 2 + 5, 13, col, lit || b.k === 4 ? 0.95 : 0.75, 'left', 0.2);
    text(values[b.k], b.x + b.w - 22, b.y + b.h / 2 + 5, 13, col, lit || b.k === 4 ? 0.95 : 0.75, 'right', 0.1);
    text(desc[b.k], vw / 2, b.y + b.h + 17, 11, COL.WHITE, 0.47, 'center', 0.03);
  }
  text(L('dailyNote'), vw / 2, vh * 0.96, 11, COL.WHITE, 0.5, 'center', 0.03);
  ctx.globalAlpha = 1;
}

// =====================================================================
// Défi du jour (logique commune dans defi.js)
// =====================================================================
const URL_JEU = 'https://aulit42369.github.io/Echo/';
const calme = matchMedia('(prefers-reduced-motion: reduce)');
const el = id => document.getElementById(id);
let accueil = null, defiSt = { count: 0, best: 0 }, defiTexte = '';
function nombre(n) { return n.toLocaleString(I18N.langs[lang].tts); }
function majAccueil() {
  const j = Defi.today(), st = Defi.load('echo'), fait = Defi.aJoue('echo', j);
  accueil = { j, fait, score: fait ? st.jours[j.key].score : 0, serie: Defi.serie('echo', j) };
}
/** ms jusqu'au prochain minuit de Paris (décalage 1 h l'hiver, 2 h l'été). */
function avantProchain() {
  const now = Date.now(), J = 86400000;
  for (const o of [1, 2]) {
    const m = now + o * 3600000, minuit = m - m % J + J - o * 3600000;
    if (Defi.parisDate(minuit).num !== Defi.parisDate(minuit - 1).num) return minuit - now;
  }
  return 0;
}
function texteDefi(serie) {
  const sec = Math.floor(dailyTime);
  return Defi.shareText({ nom: 'ÉCHO', n: defiJour.n, emoji: '🦇', score: nombre(dailyScore),
    lignes: Defi.grid(floors.flatMap(f => f.shards).map(s => s.taken ? 1 : 0), ['▫️', '💎']),
    detail: L('defiDetail', Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'), echoesUsed),
    serie, libelleSerie: L('defiSerieTxt'), url: URL_JEU });
}
function defiPanneau(on) {
  el('defiFin').hidden = !on;
  if (!on) return;
  el('defiPartager').textContent = L('defiPartager');
  el('defiApercu').textContent = defiTexte;
  el('defiApercu').setAttribute('aria-label', L('defiResume', defiJour.n, nombre(dailyScore), defiSt.count));
  el('defiLabel').textContent = L('defiCopieLabel');
  el('defiEtat').textContent = ''; el('defiCopie').hidden = true;
}
let partageEnCours = false; // un seul partage à la fois (double clic, touche P répétée)
function partager() {
  if (partageEnCours) return;
  partageEnCours = true;
  Defi.share(defiTexte).finally(() => { partageEnCours = false; }).then(r => {
    if (!r) return; // partage annulé
    const msg = L(r === 'partage' ? 'defiPartage' : r === 'copie' ? 'defiCopie' : 'defiManuel');
    el('defiEtat').textContent = msg; say(msg);
    if (r === 'manuel') { el('defiCopie').hidden = false; el('defiTexte').value = defiTexte; el('defiTexte').focus(); el('defiTexte').select(); }
  });
}
el('defiPartager').addEventListener('click', partager);
/** Picto de série : petite flamme dans la palette du jeu (pas d'emoji dans l'interface). */
function flamme(x, y, s, a) {
  const k = calme.matches ? 1 : 1 + 0.08 * sin(t * 7), h = s * k;
  const goutte = (r, hh) => { ctx.beginPath(); ctx.moveTo(x, y - hh); ctx.bezierCurveTo(x + r, y - hh * 0.2, x + r * 0.75, y + r, x, y + r);
    ctx.bezierCurveTo(x - r * 0.75, y + r, x - r, y - hh * 0.2, x, y - hh); ctx.fill(); };
  ctx.globalAlpha = a; ctx.fillStyle = COL.ORANGE; goutte(s * 0.8, h * 1.3);
  ctx.fillStyle = COL.GOLD; goutte(s * 0.4, h * 0.6);
}

// =====================================================================
// Boucle
// =====================================================================
let last = performance.now();
function frame(now) {
  const dt = min(0.05, max(0, (now - last) / 1000));
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Accès de test (console) : ECHO.go(niveau)
window.ECHO = {
  go(l) { dailyMode = false; level = l; startLevel(); },
  tp(x, y) { px = x; py = y; camX = x; camY = y; },
  state: () => ({ state, level, floorIdx, floors: floors.length, hunters: hunters.map(h => h.type),
    stairs: cur && cur.stairsTo >= 0 ? [cur.stairsX, cur.stairsY] : null, exit: cur && cur.hasExit ? [cur.exitX, cur.exitY] : null,
    beacons: cur ? cur.beacons.length : 0, lit: walls.filter(w => w.lit > t - 3).length, mother: (hunters.find(h => h.type === MERE) || {}).growth,
    pos: [px, py], hunterPos: hunters.map(h => [h.type, h.x, h.y]) }),
};

// Hors ligne : le service worker met le jeu en cache (ignoré si indisponible)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
